[project]
name = "fraud-backend"
version = "0.1.0"
description = "FastAPI backend for the Fraud Detection and Explainable AI platform"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "alembic>=1.14,<2",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.2,<6",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local alembic/ folder holds migrations; the import name is the installed package.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
