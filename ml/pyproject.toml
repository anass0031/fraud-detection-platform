[project]
name = "fraudml"
version = "0.1.0"
description = "ML package for the Fraud Detection and Explainable AI platform (data, features, models, explainability)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
]

[project.optional-dependencies]
eda = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]
train = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "optuna>=4.0",
    "xgboost>=2.1",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fraudml*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks: long print/format lines and imports next to the code that uses them are OK.
"notebooks/*.ipynb" = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
